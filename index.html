<!DOCTYPE html>
<html lang="bn" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nm Protocol - Enterprise Exchange</title>
  <style>
    :root {
      --bg-color: #0b0e11; --card-bg: #1e2329; --accent-color: #fcd535;
      --text-color: #eaecef; --text-dim: #848e9c; --border-color: #474d57;
      --success-color: #0ecb81; --error-color: #f6465d;
    }
    .light-theme {
      --bg-color: #f8f9fa; --card-bg: #ffffff; --accent-color: #0052ff;
      --text-color: #1a1a1a; --text-dim: #6c757d; --border-color: #ced4da;
    }
    body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; transition: 0.3s; }
    .container { width: 100%; max-width: 680px; background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid var(--border-color); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .controls-group { display: flex; gap: 6px; }
    .control-btn { background: var(--border-color); border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--text-color); font-size: 11px; font-weight: bold; }
    h2 { color: var(--accent-color); margin: 0; font-size: 20px; }
    .badge { font-size: 10px; background: rgba(14,203,129,0.15); color: var(--success-color); padding: 3px 7px; border-radius: 4px; border: 1px solid var(--success-color); }
    .tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    .tab-btn { flex: none; background: transparent; border: none; color: var(--text-dim); padding: 8px 10px; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; font-size: 11px; }
    .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }
    .form-group { margin-bottom: 11px; }
    label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-dim); }
    input, select, textarea { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); box-sizing: border-box; font-size: 13px; }
    button.submit-btn { width: 100%; padding: 11px; background: var(--accent-color); border: none; border-radius: 6px; color: #000; font-weight: bold; cursor: pointer; margin-top: 6px; font-size: 13px; }
    button.submit-btn:hover { opacity: 0.9; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .response-box { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 12px; word-break: break-all; display: none; }
    .response-box.success { background: rgba(14,203,129,0.15); border: 1px solid var(--success-color); color: var(--success-color); display: block; }
    .response-box.error { background: rgba(246,70,93,0.15); border: 1px solid var(--error-color); color: var(--error-color); display: block; }
    .wallet-box { background: var(--bg-color); padding: 14px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 14px; font-size: 13px; line-height: 1.6; }
    .ticker-box { background: var(--bg-color); padding: 9px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; color: var(--success-color); margin-bottom: 14px; border: 1px solid var(--border-color); }
    .item-card { background: var(--bg-color); padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 11px; border-left: 3px solid var(--accent-color); border: 1px solid var(--border-color); }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div>
      <h2>Nm Protocol</h2>
      <span class="badge">⚡ Enterprise Edition</span>
    </div>
    <div class="controls-group">
      <button class="control-btn" onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
      <button class="control-btn" onclick="toggleLanguage()" id="langBtn">English</button>
    </div>
  </div>

  <div class="ticker-box" id="liveTicker">Live Price: Connecting...</div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('register')">রেজিস্টার</button>
    <button class="tab-btn" onclick="switchTab('login')">লগইন</button>
    <button class="tab-btn" onclick="switchTab('wallet')">ওয়ালেট ও ফিয়াট</button>
    <button class="tab-btn" onclick="switchTab('spot')">স্পট ট্রেড</button>
    <button class="tab-btn" onclick="switchTab('p2p')">P2P এসক্রো</button>
    <button class="tab-btn" onclick="switchTab('support')">সাপোর্ট</button>
    <button class="tab-btn" onclick="switchTab('history')">হিস্ট্রি</button>
  </div>

  <!-- Register -->
  <div id="register" class="tab-content active">
    <form onsubmit="handleFormSubmit(event, '/api/register')">
      <div class="form-group"><label>ইউজারনেম</label><input type="text" name="username" required></div>
      <div class="form-group"><label>ইমেল (OTP)</label><input type="email" name="email" required></div>
      <div class="form-group"><label>পাসওয়ার্ড</label><input type="password" name="password" required></div>
      <button type="submit" class="submit-btn">একাউন্ট তৈরি করুন</button>
    </form>
  </div>

  <!-- Login -->
  <div id="login" class="tab-content">
    <form onsubmit="handleLoginSubmit(event)">
      <div class="form-group"><label>ইউজারনেম</label><input type="text" name="username" required></div>
      <div class="form-group"><label>পাসওয়ার্ড</label><input type="password" name="password" required></div>
      <button type="submit" class="submit-btn">লগইন করুন</button>
    </form>
  </div>

  <!-- Wallet & Fiat -->
  <div id="wallet" class="tab-content">
    <div class="wallet-box" id="walletInfo">লগইন করার পর ওয়ালেট ডেটা দেখা যাবে।</div>
    <h4 style="margin:0 0 6px; color:var(--accent-color);">💳 ফিয়াট ডিপোজিট (bKash / ব্যাংক)</h4>
    <form onsubmit="handleFiatDeposit(event)" style="margin-bottom: 14px;">
      <div class="form-group"><label>পেমেন্ট মেথড</label><select name="payment_method"><option value="bKash">bKash</option><option value="Nagad">Nagad</option><option value="Bank">Bank Transfer</option></select></div>
      <div class="form-group"><label>টাকার পরিমাণ (BDT)</label><input type="number" step="any" name="amount" required></div>
      <button type="submit" class="submit-btn" style="background:#8c9eff;">ফিয়াট ডিপোজিট করুন</button>
    </form>
    <h4 style="margin:0 0 6px; color:var(--accent-color);">🛡️ KYC ভেরিফিকেশন</h4>
    <form onsubmit="handleKYCSubmit(event)">
      <div class="form-group">
        <label>পূর্ণ নাম</label><input type="text" name="full_name" placeholder="Full Name" required style="margin-bottom:6px;">
        <label>আইডি টাইপ</label><select name="id_type" style="margin-bottom:6px;"><option value="NID">NID</option><option value="Passport">Passport</option></select>
        <label>আইডি নম্বর</label><input type="text" name="id_number" placeholder="ID Number" required>
      </div>
      <button type="submit" class="submit-btn" style="background:var(--success-color); color:#fff;">KYC ভেরিফাই করুন</button>
    </form>
  </div>

  <!-- Spot Trading -->
  <div id="spot" class="tab-content">
    <form onsubmit="handleProtectedAction(event, '/api/order')">
      <div class="form-group"><label>অর্ডার টাইপ</label><select name="order_type"><option value="BUY">BUY</option><option value="SELL">SELL</option></select></div>
      <div class="form-group"><label>প্রাইস (nsdt)</label><input type="number" step="any" name="price" required></div>
      <div class="form-group"><label>পরিমাণ (Nm)</label><input type="number" step="any" name="amount" required></div>
      <button type="submit" class="submit-btn">স্পট অর্ডার প্লেস করুন</button>
    </form>
  </div>

  <!-- P2P Escrow -->
  <div id="p2p" class="tab-content">
    <form onsubmit="handleProtectedAction(event, '/api/p2p/ad')" style="margin-bottom: 12px;">
      <div class="form-group"><label>অ্যাড টাইপ</label><select name="ad_type"><option value="SELL">SELL (Escrow Lock)</option><option value="BUY">BUY</option></select></div>
      <div class="form-group"><label>অ্যাসেট</label><select name="asset"><option value="Nm">Nm</option></select></div>
      <div class="form-group"><label>প্রাইস</label><input type="number" step="any" name="price" required></div>
      <div class="form-group"><label>পরিমাণ</label><input type="number" step="any" name="amount" required></div>
      <div class="form-group"><label>পেমেন্ট মেথড</label><input type="text" name="payment_method" value="bKash" required></div>
      <button type="submit" class="submit-btn">P2P অ্যাড পোস্ট করুন</button>
    </form>
    <button class="submit-btn" style="background:var(--success-color); color:#fff; margin-bottom:8px;" onclick="loadP2PAds()">অ্যাডস্ রিফ্রেশ করুন</button>
    <div id="p2pAdsList"></div>
  </div>

  <!-- Support -->
  <div id="support" class="tab-content">
    <h4 style="color:var(--accent-color); margin-top:0;">💬 ২৪/৭ কাস্টমার সাপোর্ট</h4>
    <form onsubmit="handleSupportTicket(event)" style="margin-bottom:12px;">
      <div class="form-group"><label>বিষয়</label><input type="text" name="subject" required></div>
      <div class="form-group"><label>বিবরণ</label><textarea name="message" rows="3" required></textarea></div>
      <button type="submit" class="submit-btn">টিকিট সাবমিট করুন</button>
    </form>
    <button class="submit-btn" style="background:#0ecb81; color:#fff;" onclick="loadTickets()">আমার টিকিটসমূহ</button>
    <div id="ticketsList" style="margin-top:10px;"></div>
  </div>

  <!-- History -->
  <div id="history" class="tab-content">
    <button class="submit-btn" style="margin-bottom:10px;" onclick="loadTransactions()">হিস্ট্রি রিফ্রেশ করুন</button>
    <div id="txHistoryList"></div>
  </div>

  <div id="responseBox" class="response-box"></div>
</div>

<script>
  let jwtToken = localStorage.getItem('token') || '';
  let currentLang = 'bn';

  function toggleTheme() {
    document.body.classList.toggle('light-theme');
    const isLight = document.body.classList.contains('light-theme');
    document.getElementById('themeBtn').innerText = isLight ? '🌙 Dark' : '☀️ Light';
  }

  function toggleLanguage() {
    currentLang = currentLang === 'bn' ? 'en' : 'bn';
    document.getElementById('langBtn').innerText = currentLang === 'bn' ? 'English' : 'বাংলা';
  }

  function connectWebSocket() {
    const ws = new WebSocket((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws/ticker');
    ws.onmessage = e => { const d = JSON.parse(e.data); document.getElementById('liveTicker').innerText = `${d.symbol} : $${d.price} (${d.time})`; };
    ws.onclose = () => setTimeout(connectWebSocket, 3000);
  }
  connectWebSocket();

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
    document.getElementById('responseBox').className = 'response-box';
    if (tabId === 'wallet') loadWallet();
    if (tabId === 'p2p') loadP2PAds();
    if (tabId === 'history') loadTransactions();
    if (tabId === 'support') loadTickets();
  }

  async function handleFormSubmit(e, ep) { e.preventDefault(); sendRequest(ep, 'POST', Object.fromEntries(new FormData(e.target).entries())); }
  async function handleLoginSubmit(e) {
    e.preventDefault();
    const res = await sendRequest('/api/login', 'POST', Object.fromEntries(new FormData(e.target).entries()));
    if (res && res.access_token) { jwtToken = res.access_token; localStorage.setItem('token', jwtToken); switchTab('wallet'); }
  }
  async function handleKYCSubmit(e) { e.preventDefault(); if(!jwtToken) return; await sendRequest('/api/kyc/verify', 'POST', Object.fromEntries(new FormData(e.target).entries()), {'Authorization': `Bearer ${jwtToken}`}); loadWallet(); }
  async function handleFiatDeposit(e) { e.preventDefault(); if(!jwtToken) return; const d = Object.fromEntries(new FormData(e.target).entries()); d.amount = parseFloat(d.amount); d.currency = 'BDT'; await sendRequest('/api/fiat/deposit', 'POST', d, {'Authorization': `Bearer ${jwtToken}`}); loadWallet(); }
  async function handleSupportTicket(e) { e.preventDefault(); if(!jwtToken) return; await sendRequest('/api/support/ticket', 'POST', Object.fromEntries(new FormData(e.target).entries()), {'Authorization': `Bearer ${jwtToken}`}); loadTickets(); }
  
  async function handleProtectedAction(e, ep) {
    e.preventDefault(); if(!jwtToken) { showResponse('প্রথমে লগইন করুন!', false); return; }
    const d = Object.fromEntries(new FormData(e.target).entries());
    if(d.amount) d.amount = parseFloat(d.amount); if(d.price) d.price = parseFloat(d.price);
    await sendRequest(ep, 'POST', d, {'Authorization': `Bearer ${jwtToken}`});
    if(ep.includes('p2p')) { loadWallet(); loadP2PAds(); }
  }

  async function sendRequest(ep, meth, body, headers={}) {
    const box = document.getElementById('responseBox'); box.className = 'response-box'; box.innerText = 'Processing...';
    try {
      const res = await fetch(ep, {method: meth, headers: {'Content-Type': 'application/json', ...headers}, body: JSON.stringify(body)});
      const r = await res.json();
      if(res.ok) { showResponse(r.message || 'Success!', true); return r; }
      else { showResponse(r.detail || 'Failed!', false); }
    } catch(err) { showResponse('Connection Error!', false); }
  }

  function showResponse(msg, success) {
    const box = document.getElementById('responseBox'); box.className = `response-box ${success ? 'success' : 'error'}`; box.innerText = msg;
  }

  async function loadWallet() {
    if(!jwtToken) return;
    const res = await fetch('/api/wallet', {headers: {'Authorization': `Bearer ${jwtToken}`}});
    const w = await res.json();
    if(res.ok) {
      document.getElementById('walletInfo').innerHTML = `👤 <b>User:</b> ${w.username}<br>💎 <b>Nm:</b> ${w.nm_balance.toFixed(4)} | 💵 <b>nsdt:</b> ${w.nsdt_balance.toFixed(4)}<br>💳 <b>BDT Fiat:</b> ৳${w.fiat_bdt_balance.toFixed(2)}<br>🛡️ <b>KYC:</b> ${w.kyc_status} | 📊 <b>AML Risk:</b> ${w.aml_risk_score}`;
    }
  }

  async function loadP2PAds() {
    const ads = await (await fetch('/api/p2p/ads')).json();
    const list = document.getElementById('p2pAdsList'); list.innerHTML = '<h4>P2P Ads:</h4>';
    if(!ads.length) { list.innerHTML += '<p style="font-size:11px;color:var(--text-dim);">No ads found.</p>'; return; }
    ads.forEach(a => { list.innerHTML += `<div class="item-card"><b>Seller:</b> ${a.seller} | <b>Type:</b> ${a.type} | <b>Amt:</b> ${a.amount} ${a.asset} | <b>Price:</b> ${a.price} | <b>Pay:</b> ${a.method}</div>`; });
  }

  async function loadTickets() {
    if(!jwtToken) return;
    const tickets = await (await fetch('/api/support/tickets', {headers: {'Authorization': `Bearer ${jwtToken}`}})).json();
    const list = document.getElementById('ticketsList'); list.innerHTML = '<h4>Active Tickets:</h4>';
    if(!tickets.length) { list.innerHTML += '<p style="font-size:11px;color:var(--text-dim);">No support tickets.</p>'; return; }
    tickets.forEach(t => { list.innerHTML += `<div class="item-card"><b>Sub:</b> ${t.subject} | <b>Msg:</b> ${t.message}<br><b>Priority:</b> ${t.priority} | <b>Status:</b> ${t.status} | ${t.time}</div>`; });
  }

  async function loadTransactions() {
    if(!jwtToken) return;
    const res = await fetch('/api/transactions', {headers: {'Authorization': `Bearer ${jwtToken}`}});
    const txs = await res.json();
    const list = document.getElementById('txHistoryList'); list.innerHTML = '<h4>History:</h4>';
    if(!txs.length) { list.innerHTML += '<p style="font-size:11px;color:var(--text-dim);">No history.</p>'; return; }
    txs.forEach(t => { list.innerHTML += `<div class="item-card"><span><b>${t.type}</b> (${t.asset})</span><span>Amt: ${t.amount} | ${t.time}</span></div>`; });
  }
</script>

</body>
</html>
